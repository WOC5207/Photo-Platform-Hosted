services:
  db:
    image: postgres:17-alpine
    container_name: photo-platform-db
    restart: unless-stopped
    # No `ports:` on purpose — the database is reachable only from the `app`
    # container over the compose network, never from the NAS LAN.
    environment:
      POSTGRES_USER: photo
      POSTGRES_DB: photo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # The database lives here. Back this folder up (Hyper Backup) alongside
      # ./data/photos — together they are the whole site.
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo -d photo"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: ${DB_MEMORY_LIMIT:-768m}

  app:
    image: ${PHOTO_PLATFORM_IMAGE:-ghcr.io/woc5207/photo-platform-hosted:stable}
    container_name: photo-platform
    restart: unless-stopped
    depends_on:
      db:
        # The entrypoint runs `prisma migrate deploy` immediately on start;
        # waiting for the healthcheck is what stops it racing Postgres' boot.
        condition: service_healthy
    ports:
      # Loopback-only: DSM's reverse proxy can reach this port, while LAN and
      # internet clients cannot bypass HTTPS or forge proxy headers directly.
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      # Paths/hosts inside the container — do not change; edit the volume
      # mappings below instead. `db` is the service name above.
      DATABASE_URL: "postgresql://photo:${POSTGRES_PASSWORD}@db:5432/photo?schema=public&connection_limit=10"
      PHOTOS_DIR: "/data/photos"
      NODE_OPTIONS: "--max-old-space-size=${NODE_MAX_OLD_SPACE_MB:-768}"
      MALLOC_ARENA_MAX: "2"
      IMAGE_PROCESSING_CONCURRENCY: "${IMAGE_PROCESSING_CONCURRENCY:-1}"
    mem_limit: ${APP_MEMORY_LIMIT:-1536m}
    volumes:
      # Left side = folder on the NAS (created automatically next to this
      # compose file). Point these at shared-folder paths if you prefer,
      # e.g. /volume1/docker/photo-platform/photos:/data/photos
      - ./data/photos:/data/photos
