name: Security and UX verification

on:
  # Changes that only touch docs or notes skip verification (and so the NAS
  # image too).
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - ".interface-design/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - ".interface-design/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Pushes to
# main never share a group, so no merge's run is cancelled or dropped: the NAS
# image only builds after a successful main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A merge to main usually lands exactly the code its pull request's last run
  # already verified (the PR branch had main merged in). Pull request runs
  # record the tree they passed on; a main push with the same tree skips the
  # full suite. When main moved after that run, the tree differs and the full
  # suite runs again before the NAS image can build.
  already-verified:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified=false
          if tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha) &&
             count=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=verified-tree-$tree&per_page=100" \
               --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == $GITHUB_REPOSITORY_ID)] | length") &&
             [ "$count" -gt 0 ]; then
            verified=true
            echo "Tree $tree already passed the full suite on a pull request run, so it is not run again." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

  verify:
    needs: already-verified
    # Pull request runs skip the check above, so run unless it found a match.
    if: ${{ !cancelled() && needs.already-verified.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: photo
          POSTGRES_PASSWORD: photo-test-password
          POSTGRES_DB: photo_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U photo -d photo_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://photo:photo-test-password@127.0.0.1:5432/photo_e2e?schema=public&connection_limit=20
      E2E_DATABASE_URL: postgresql://photo:photo-test-password@127.0.0.1:5432/photo_e2e?schema=public&connection_limit=20
      PHOTOS_DIR: /tmp/photo-platform-ci
      SESSION_SECRET: ci-only-session-secret-with-at-least-thirty-two-characters
      APP_BASE_URL: http://127.0.0.1:3001
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-admin-password-123
      E2E_ADMIN_USERNAME: ci-admin
      E2E_ADMIN_PASSWORD: ci-admin-password-123
      E2E_SESSION_SECRET: ci-only-session-secret-with-at-least-thirty-two-characters
      E2E_ALLOW_MUTATIONS: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
      PLAYWRIGHT_CHANNEL: chromium
      TRUSTED_PROXY_HOPS: "1"
      IMAGE_MAX_PIXELS: "100000000"
      IMAGE_PROCESSING_CONCURRENCY: "1"
      PUBLIC_MEDIA_METADATA_TTL_SECONDS: "1"
      UPLOAD_MAX_MB: "100"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # Node 26 bundles npm 11, the npm version that generated this lockfile
      # and the one the Docker build uses, so no npm upgrade step is needed.
      - run: npm ci
      - run: npm audit
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run test:miniapp
      - run: npx prisma migrate deploy
      - run: npm run test:miniapp:db
      - run: npm run test:security
      - run: npm run test:moderation
      - run: npm run test:images
      - run: npm run test:downloads
      - run: npm run test:email
      - run: npm run test:theme
      - run: npm run test:site-mode
      - run: npm run test:archive-field
      - run: npm run test:sharing-posters
      - run: npm run test:subject-detection
      - run: npm run test:onboarding-tour
      - run: npm run test:cosplan
      - run: npm run test:concurrency
      - run: npm run test:isolation
      - run: npm run test:quota
      - run: npm run test:security:db
      - run: npm run test:moderation:db
      - run: npm run test:bookingorg
      - run: npm run build
      - run: npm run test:build-budget
      - run: npm run test:cosplan:mobile
      - run: npm run test:cosplan:render
      - run: npx playwright install --with-deps chromium
      - name: HTTP isolation and browser coverage
        shell: bash
        run: |
          mkdir -p "$PHOTOS_DIR"
          npm start > /tmp/photo-platform-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$APP_BASE_URL/en/login" > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/photo-platform-server.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent "$APP_BASE_URL/en/login" > /dev/null
          npm run test:http
          npm run test:e2e -- --workers=1
        env:
          NODE_ENV: production
          PORT: "3001"

      # Only same-repository pull requests count: a fork controls its own
      # workflow file and could record a tree it never tested.
      - name: Record the verified tree
        id: tree
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          mkdir -p /tmp/verified-tree
          printf 'tree %s\ncommit %s\npr %s\n' "$tree" "$GITHUB_SHA" "${{ github.event.pull_request.number }}" > /tmp/verified-tree/info.txt
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.tree.outputs.tree
        continue-on-error: true
        with:
          name: verified-tree-${{ steps.tree.outputs.tree }}
          path: /tmp/verified-tree/info.txt
          retention-days: 14
          overwrite: true
