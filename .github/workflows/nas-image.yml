name: NAS production image

on:
  workflow_run:
    workflows: ["Security and UX verification"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

# One build at a time, so two quick merges can't race on the `stable` tag. A
# third merge replaces the waiting build, which its newer image includes.
concurrency:
  group: nas-image
  cancel-in-progress: false

jobs:
  publish:
    # The `branches` filter above matches the triggering run's head branch
    # *name*, which a fork's pull request also controls (a fork branch called
    # "main" passes). Only publish verify runs that were pushes to this
    # repository's own main branch.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/woc5207/photo-platform-hosted
          tags: |
            type=raw,value=sha-${{ env.RELEASE_SHA }}
            type=raw,value=stable
      - name: Verify runtime image size
        shell: bash
        run: |
          docker buildx build --platform linux/amd64 --load -t photo-platform:size-check .
          bytes=$(docker image inspect photo-platform:size-check --format '{{.Size}}')
          echo "Runtime image: $((bytes / 1024 / 1024)) MB"
          test "$bytes" -le 629145600
          docker run --rm --entrypoint node photo-platform:size-check \
            /app/migration/node_modules/prisma/build/index.js --version
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # The image is pushed before the cache upload, so a failed cache
          # write (GitHub's cache service sometimes answers "error writing
          # layer blob: not_found") must not turn a published release red.
          cache-to: type=gha,mode=max,ignore-error=true
          provenance: true
